<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPViber - FPV Drone Assistant</title>
    <meta name="description"
        content="FPViber - an FPV drone technical assistant powered by Gemini and specialised FPV documentation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>
    <!-- ============== SVG ICON SYMBOLS ============== -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <!-- Drone (top-down quad) -->
            <symbol id="i-drone" viewBox="0 0 64 64">
                <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="14" y1="14" x2="50" y2="50" />
                    <line x1="50" y1="14" x2="14" y2="50" />
                    <rect x="24" y="24" width="16" height="16" rx="2" />
                    <circle cx="14" cy="14" r="8" />
                    <circle cx="50" cy="14" r="8" />
                    <circle cx="14" cy="50" r="8" />
                    <circle cx="50" cy="50" r="8" />
                    <circle cx="32" cy="32" r="2" fill="currentColor" />
                </g>
            </symbol>

            <!-- Propeller -->
            <symbol id="i-propeller" viewBox="0 0 24 24">
                <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M12 12c-3 -5 -8 -6 -10 -3s2 7 10 3z" />
                    <path d="M12 12c3 5 8 6 10 3s-2 -7 -10 -3z" />
                    <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" />
                </g>
            </symbol>

            <!-- Motor (brushless) -->
            <symbol id="i-motor" viewBox="0 0 24 24">
                <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="8" />
                    <circle cx="12" cy="12" r="3" />
                    <path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M6.3 17.7l2.1-2.1M15.6 8.4l2.1-2.1" />
                </g>
            </symbol>

            <!-- Plus -->
            <symbol id="i-plus" viewBox="0 0 24 24">
                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </g>
            </symbol>

            <!-- Send (paper plane) -->
            <symbol id="i-send" viewBox="0 0 24 24">
                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13" />
                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                </g>
            </symbol>

            <!-- Pencil -->
            <symbol id="i-pencil" viewBox="0 0 24 24">
                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </g>
            </symbol>

            <!-- Trash -->
            <symbol id="i-trash" viewBox="0 0 24 24">
                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
                </g>
            </symbol>

            <!-- Menu -->
            <symbol id="i-menu" viewBox="0 0 24 24">
                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </g>
            </symbol>

            <!-- Battery -->
            <symbol id="i-battery" viewBox="0 0 24 24">
                <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="17" height="10" rx="2" />
                    <line x1="22" y1="11" x2="22" y2="13" />
                    <line x1="6" y1="10" x2="6" y2="14" />
                    <line x1="10" y1="10" x2="10" y2="14" />
                </g>
            </symbol>
        </defs>
    </svg>

    <div class="app">
        <!-- ============== SIDEBAR ============== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <div class="brand">
                    <div class="brand__mark">
                        <svg class="brand__drone" aria-hidden="true">
                            <use href="#i-drone"></use>
                        </svg>
                    </div>
                    <div class="brand__text">
                        <div class="brand__title">FPViber</div>
                        <div class="brand__subtitle">FPV Drone Assistant</div>
                    </div>
                </div>
                <button class="icon-btn" id="newChatBtn" title="New conversation" aria-label="New conversation">
                    <svg aria-hidden="true">
                        <use href="#i-plus"></use>
                    </svg>
                </button>
            </div>

            <button class="new-chat" id="newChatBtnLarge">
                <svg aria-hidden="true">
                    <use href="#i-plus"></use>
                </svg>
                New conversation
            </button>

            <div class="sidebar__label">Recent</div>
            <div class="session-list" id="sessionList">
                <!-- session items injected via JS -->
            </div>

            <div class="sidebar__footer">
                <div class="status" id="engineStatus">
                    <span class="status__dot" data-state="loading"></span>
                    <span class="status__text">Spinning up motors...</span>
                </div>
            </div>
        </aside>

        <!-- ============== MAIN ============== -->
        <main class="main">
            <header class="main__header">
                <button class="icon-btn icon-btn--ghost" id="toggleSidebar" title="Toggle sidebar"
                    aria-label="Toggle sidebar">
                    <svg aria-hidden="true">
                        <use href="#i-menu"></use>
                    </svg>
                </button>
                <div class="main__title">
                    <h1 id="conversationTitle">New conversation</h1>
                    <span class="main__subtitle" id="conversationMeta"></span>
                </div>
                <div class="main__actions">
                    <button class="icon-btn icon-btn--ghost" id="renameBtn" title="Rename" disabled>
                        <svg aria-hidden="true">
                            <use href="#i-pencil"></use>
                        </svg>
                    </button>
                    <button class="icon-btn icon-btn--ghost" id="deleteBtn" title="Delete" disabled>
                        <svg aria-hidden="true">
                            <use href="#i-trash"></use>
                        </svg>
                    </button>
                </div>
            </header>

            <section class="messages" id="messages">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state__icon">
                        <svg aria-hidden="true">
                            <use href="#i-drone"></use>
                        </svg>
                    </div>
                    <h2 class="empty-state__title">Ask anything about <span class="accent-text">FPV</span></h2>
                    <p>Powered by Gemini and specialized FPV technical documentation.</p>
                    <div class="suggestions" id="suggestions">
                        <button class="suggestion" data-q="What is FPV?">
                            <svg class="suggestion__icon" aria-hidden="true">
                                <use href="#i-drone"></use>
                            </svg>
                            <span>What is FPV?</span>
                        </button>
                        <button class="suggestion" data-q="How to build a drone for the first time?">
                            <svg class="suggestion__icon" aria-hidden="true">
                                <use href="#i-motor"></use>
                            </svg>
                            <span>How to build a drone for the first time?</span>
                        </button>
                        <button class="suggestion" data-q="What is the minimum budget for building a drone?">
                            <svg class="suggestion__icon" aria-hidden="true">
                                <use href="#i-battery"></use>
                            </svg>
                            <span>What is the minimum budget for building a drone?</span>
                        </button>
                    </div>
                </div>
            </section>

            <footer class="composer">
                <form class="composer__form" id="chatForm" autocomplete="off">
                    <textarea id="chatInput" class="composer__input" placeholder="Ask anything about FPV..." rows="1"
                        disabled></textarea>
                    <button type="submit" class="composer__send" id="sendBtn" disabled aria-label="Send">
                        <svg aria-hidden="true">
                            <use href="#i-send"></use>
                        </svg>
                    </button>
                </form>
                <div class="composer__hint">
                    Press <kbd>Enter</kbd> to send &middot; <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line
                </div>
            </footer>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
